<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Rayyan Auction</title><style>body{margin:0;background:#090b12;color:#fff;font-family:Arial,sans-serif;padding:16px}.wrap{max-width:700px;margin:auto}.card{background:#151927;border:1px solid #30364b;border-radius:16px;padding:18px;margin-bottom:15px}h1{margin:0 0 15px}.live{color:#ff5364;font-weight:bold}.grid{display:grid;gap:10px}input,button{width:100%;padding:14px;border-radius:10px;border:0;font-size:16px;box-sizing:border-box}input{background:#0b0e16;color:#fff;border:1px solid #343b52}button{background:#7650e8;color:#fff;font-weight:bold;margin-top:8px}button:active{transform:scale(.98)}.danger{background:#a52e3a}.green{background:#16804a}.timer{text-align:center;font-size:55px;font-weight:bold;margin:15px}.result{text-align:center;padding:22px;background:#0b0e16;border-radius:12px;font-size:22px;font-weight:bold}.history{border-top:1px solid #30364b;padding-top:10px;margin-top:12px}.item{padding:10px 0;border-bottom:1px solid #292e40}.muted{color:#9da5b9}</style></head><body><div class="wrap"><div class="card"><h1>🔨 Rayyan Auction</h1><div class="live">🔴 LIVE</div></div><div class="card"><h2 id="player">No player</h2><div class="muted">Entry</div><h3 id="entry">—</h3><div class="timer" id="timer">00:30</div><div class="result" id="result">RESULT HIDDEN</div></div><div class="card"><h2>Admin</h2><div class="grid"><input id="name" placeholder="Player username"><input id="amount" placeholder="Entry amount"><input id="unit" value="items" placeholder="Unit"><input id="item" placeholder="Result / item"><input id="seconds" type="number" value="30" min="1"><button onclick="loadPlayer()">LOAD PLAYER</button><button onclick="startTimer()">START COUNTDOWN</button><button onclick="reveal()">REVEAL RESULT</button><button class="green" onclick="sold()">SOLD</button><button class="danger" onclick="clearCurrent()">CLEAR</button></div></div><div class="card"><h2>📜 Live History</h2><div id="history"><div class="muted">No results yet.</div></div></div></div><script>var state={name:'',amount:'',unit:'items',item:'',left:30,timer:null};function $(id){return document.getElementById(id)}function render(){ $('player').textContent=state.name||'No player';$('entry').textContent=state.amount?(state.amount+' '+state.unit):'—';$('timer').textContent='00:'+String(Math.max(0,state.left)).padStart(2,'0');}function loadPlayer(){state.name=$('name').value||'Unknown';state.amount=$('amount').value||'0';state.unit=$('unit').value||'items';state.item=$('item').value||'';state.left=Math.max(1,parseInt($('seconds').value)||30);$('result').textContent='RESULT HIDDEN';render()}function startTimer(){clearInterval(state.timer);state.left=Math.max(1,parseInt($('seconds').value)||30);render();state.timer=setInterval(function(){state.left--;render();if(state.left<=0){clearInterval(state.timer);state.timer=null;$('result').textContent='TIME UP — RESULT HIDDEN'}},1000)}function reveal(){clearInterval(state.timer);state.timer=null;$('result').textContent=state.item||'No result entered'}function sold(){clearInterval(state.timer);state.timer=null;$('result').textContent=state.item||'No result entered';var h=$('history');if(h.querySelector('.muted'))h.innerHTML='';var d=document.createElement('div');d.className='item';d.innerHTML='<b>'+safe(state.name)+'</b> — '+safe(state.amount)+' '+safe(state.unit)+'<br><span class="muted">'+safe(state.item||'No result')+' • SOLD</span>';h.prepend(d)}function clearCurrent(){clearInterval(state.timer);state={name:'',amount:'',unit:'items',item:'',left:30,timer:null};$('name').value='';$('amount').value='';$('unit').value='items';$('item').value='';$('seconds').value='30';$('result').textContent='RESULT HIDDEN';render()}function safe(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}render();</script></body></html>
